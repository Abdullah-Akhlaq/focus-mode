<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 6px 0 12px; color: #555; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .primary { background: #1a73e8; color: #fff; }
  .danger { background: #d93025; color: #fff; }
  .ghost { background: #eee; color: #333; }
  input[type=number] { width: 80px; padding: 6px; font-size: 14px; }
  .big { font-size: 32px; font-weight: 700; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  #challenge { background: #f5f5f5; padding: 10px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.5; user-select: none; margin-bottom: 8px; }
  textarea { width: 100%; box-sizing: border-box; padding: 8px; font: 13px ui-monospace, monospace; }
  #err { color: #d93025; min-height: 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="setup">
    <h1>Focus Lock</h1>
    <p>Locks Chrome to the tab you are on right now.</p>
    <label>Minutes: <input id="minutes" type="number" min="1" max="480" value="60"></label>
    <button id="start" class="primary">Start focus</button>
  </div>

  <div id="active" hidden>
    <h1>Focus is ON</h1>
    <div id="left" class="big"></div>
    <button id="quit" class="ghost">I want to quit early</button>
  </div>

  <div id="exit" hidden>
    <h1>Quit early?</h1>
    <p id="wait"></p>
    <div id="typing" hidden>
      <p>Type this exactly. Pasting is disabled.</p>
      <div id="challenge"></div>
      <textarea id="answer" rows="5" spellcheck="false" autocomplete="off"></textarea>
      <div id="err"></div>
      <button id="confirm" class="danger">Turn off focus</button>
    </div>
    <button id="stay" class="primary">Keep focusing</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
